name: Binding and C ABI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            odin_release: nightly
          - os: macos-15
            odin_release: nightly
          - os: macos-15-intel
            odin_release: ''
          - os: ubuntu-latest
            odin_release: nightly
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ matrix.odin_release }}
      - name: Verify Odin installation
        run: odin version
      - uses: actions/cache@v4
        with:
          path: .deps/accesskit
          key: accesskit-c-0.23.1-${{ runner.os }}-${{ runner.arch }}
      - name: Windows binding, ABI and native smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/check.ps1
      - name: Unix binding, ABI and external consumer
        if: runner.os != 'Windows'
        run: sh tools/check.sh
